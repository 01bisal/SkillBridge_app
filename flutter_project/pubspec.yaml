name: skillbridge
description: A mentoring and skill development platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.6

  # Date/Time formatting
  intl: ^0.19.0

  # State Management
  provider: ^6.1.1

  # Image Picker (Gallery & Camera)
  image_picker: ^1.0.5

  # Permission Handler
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets (images)
  assets:
    - assets/images/
